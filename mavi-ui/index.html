<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Per-route values below are rewritten at build time by scripts/prerender.mjs,
       so crawlers that do not execute JavaScript still receive correct metadata. -->
  <title>MaviSolution | SRE &amp; DevOps Managed Services</title>
  <meta name="description"
    content="MaviSolution runs 24/7 site reliability engineering, DevOps automation and cloud operations for scaling startups and enterprises across India, the UAE and the USA.">
  <link rel="canonical" href="https://www.mavisolution.com/">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <!-- Icons (self-hosted; previously a 503 KB image hotlinked from a free host) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MaviSolution">
  <meta property="og:title" content="MaviSolution | SRE &amp; DevOps Managed Services">
  <meta property="og:description"
    content="24/7 site reliability engineering, DevOps automation and cloud operations for scaling startups and enterprises.">
  <meta property="og:url" content="https://www.mavisolution.com/">
  <meta property="og:image" content="https://www.mavisolution.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MaviSolution — Site Reliability Engineering, DevOps Automation and CloudOps">
  <meta property="og:locale" content="en">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MaviSolution | SRE &amp; DevOps Managed Services">
  <meta name="twitter:description"
    content="24/7 site reliability engineering, DevOps automation and cloud operations for scaling startups and enterprises.">
  <meta name="twitter:image" content="https://www.mavisolution.com/og-image.png">

  <!-- Theme Initialization Script (blocking, to prevent a flash of the wrong theme) -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) { }
    })();
  </script>

  <!-- Third-party origins: warm the connection early. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <link rel="preload" as="image" href="/logo.png" fetchpriority="high">

  <!-- Font Awesome loaded non-blocking: applied once downloaded rather than
       holding up first paint. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <script type="application/ld+json" data-seo-jsonld>{}</script>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-void-navy dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
